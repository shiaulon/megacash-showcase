<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Demonstração interativa do MegaCash com dados fictícios.">
  <title>MegaCash Demo</title>
  <link rel="icon" href="../assets/megacash-icon.png">
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="demo-banner">
    <span>Ambiente demonstrativo</span>
    <span>Dados fictícios, atualizados automaticamente</span>
  </div>

  <div class="app-shell">
    <aside class="sidebar" aria-label="Navegação principal">
      <div class="brand">
        <img src="../assets/megacash-icon.png" alt="">
        <strong>MegaCash</strong>
      </div>
      <nav class="desktop-nav"></nav>
      <div class="demo-profile">
        <div class="avatar">MC</div>
        <div><strong>Conta demonstração</strong><span>Plano Pro</span></div>
      </div>
    </aside>

    <main>
      <header class="topbar">
        <div>
          <p class="eyebrow" id="current-period"></p>
          <h1 id="page-title">Dashboard</h1>
        </div>
        <div class="topbar-actions">
          <button class="icon-button" type="button" title="Notificações" aria-label="Notificações">
            <i data-lucide="bell"></i><span class="notification-dot"></span>
          </button>
          <button class="primary-button" id="add-transaction" type="button">
            <i data-lucide="plus"></i><span>Nova transação</span>
          </button>
        </div>
      </header>

      <section id="view" aria-live="polite"></section>
    </main>

    <nav class="mobile-nav" aria-label="Navegação principal"></nav>
  </div>

  <dialog id="transaction-dialog">
    <form method="dialog" id="transaction-form">
      <div class="dialog-header">
        <div><p class="eyebrow">Demonstração</p><h2>Nova transação</h2></div>
        <button class="icon-button" value="cancel" title="Fechar" aria-label="Fechar"><i data-lucide="x"></i></button>
      </div>
      <label>Descrição<input name="description" value="Café com cliente" required maxlength="40"></label>
      <div class="form-grid">
        <label>Valor<input name="amount" type="number" value="28.50" min="0.01" step="0.01" required></label>
        <label>Tipo<select name="type"><option value="expense">Despesa</option><option value="income">Receita</option></select></label>
      </div>
      <label>Categoria<select name="category"><option>Alimentação</option><option>Moradia</option><option>Transporte</option><option>Lazer</option><option>Salário</option></select></label>
      <p class="form-note">A transação existe apenas nesta demonstração e será descartada ao recarregar.</p>
      <button class="primary-button full-button" value="default" type="submit"><i data-lucide="check"></i>Adicionar</button>
    </form>
  </dialog>

  <div id="toast" role="status"></div>
</body>
</html>
